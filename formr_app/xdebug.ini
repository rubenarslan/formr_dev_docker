; Xdebug for the formr dev container. Bind-mounted to
; /usr/local/etc/php/conf.d/zz-xdebug-formr.ini (the zz- prefix makes it load
; after docker-php-ext-xdebug.ini so these settings win). Mode is set via the
; XDEBUG_MODE env var in docker-compose.yml.
;
; Trigger mode: nothing activates unless XDEBUG_TRIGGER (cookie / GET param /
; env var) is present, so normal requests aren't slowed and CLI invocations
; don't spam "could not connect to debugging client".
;
; IMPORTANT: never set the XDEBUG_CONFIG env var. In Xdebug 3 its mere presence
; forces step-debug on every request, bypassing start_with_request=trigger.
; Keep client_host/port/idekey here instead.
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = VSCODE
xdebug.discover_client_host = false
