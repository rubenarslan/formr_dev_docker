[php]
display_errors = Off
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M

; Xdebug is loaded by docker-php-ext-xdebug.ini and configured in xdebug.ini
; (mounted as zz-xdebug-formr.ini). No xdebug settings here: a second
; zend_extension line makes every CLI call warn "Cannot load Xdebug - it was
; already loaded", and start_with_request=yes would defeat trigger mode.
